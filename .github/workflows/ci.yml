name: CI

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  build:
    # Windows é obrigatório: CalculadoraJurosCompostos.UI e .UI.Testes têm target
    # net10.0-windows e não compilam em Linux. Rodar em ubuntu cobriria apenas os
    # projetos multiplataforma, deixando os testes de apresentação de fora.
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Configurar .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Restaurar dependências
        run: dotnet restore

      - name: Compilar
        run: dotnet build --no-restore --configuration Release

      - name: Executar testes
        run: dotnet test --no-build --configuration Release --verbosity normal
